name: Refresh market quotes
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect-quotes.mjs', '.github/workflows/refresh-quotes.yml']
permissions:
  contents: read
concurrency:
  group: market-quotes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Collect and publish public quotes
        run: node scripts/collect-quotes.mjs --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
